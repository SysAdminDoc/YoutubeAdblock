name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Two runs for the same tag would race the `gh release upload --clobber`
# call and could publish incomplete assets. Cancel in-progress runs when
# a newer commit or a retry lands.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node (for syntax-checking generated JS)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Regenerate extension/main.js from userscript
        shell: pwsh
        run: ./Build-Extension.ps1

      - name: Resolve + validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./extension/manifest.json').version")
          USERSCRIPT_VERSION=$(grep -E '^// @version' YoutubeAdblock.user.js | head -n1 | awk '{print $3}')
          if [ -z "$VERSION" ] || [ -z "$USERSCRIPT_VERSION" ]; then
            echo "::error::Could not parse version from manifest or userscript"
            exit 1
          fi
          if [ "$VERSION" != "$USERSCRIPT_VERSION" ]; then
            echo "::error::Version mismatch: extension/manifest.json=$VERSION userscript=$USERSCRIPT_VERSION"
            exit 1
          fi
          # On tag pushes, also verify the tag matches the manifest version.
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag version v$TAG_VERSION does not match manifest version $VERSION"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=$VERSION"

      - name: Validate cross-browser manifest contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
          const background = manifest.background || {};
          const minChrome = String(manifest.minimum_chrome_version || '');
          if (!background.service_worker) {
            throw new Error('Manifest must declare background.service_worker for Chromium MV3.');
          }
          if (!Array.isArray(background.scripts) || !background.scripts.length) {
            throw new Error('Manifest must retain background.scripts for Firefox MV3 compatibility.');
          }
          const chromeMajor = parseInt(minChrome.split('.')[0], 10);
          if (!Number.isFinite(chromeMajor) || chromeMajor < 121) {
            throw new Error('minimum_chrome_version must be 121+ when background.scripts and service_worker are both present.');
          }
          const geckoMin = String((((manifest.browser_specific_settings || {}).gecko) || {}).strict_min_version || '');
          const firefoxMajor = parseInt(geckoMin.split('.')[0], 10);
          if (!Number.isFinite(firefoxMajor) || firefoxMajor < 128) {
            throw new Error('Firefox strict_min_version must stay at 128+ to match the documented MV3 support floor.');
          }
          console.log(`Manifest contract OK | minimum_chrome_version=${minChrome} | firefox=${geckoMin}`);
          NODE

      - name: Syntax-check generated JS
        shell: bash
        run: |
          set -euo pipefail
          node --check YoutubeAdblock.user.js
          node --check extension/main.js
          node --check extension/bridge.js
          node --check extension/background.js
          # Validate JSON shape of manifest + DNR rules
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('extension/rules/network-blocks.json','utf8'))"
          node --test tests/*.test.mjs

      - name: Package extension (.zip)
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd extension
          # Exclude the dev-facing README from the shipped package —
          # it's only useful to contributors browsing the source tree.
          zip -r -X "../YoutubeAdblock-extension-v${VERSION}.zip" . \
            -x "README.md"
          cd ..
          ls -la YoutubeAdblock-extension-v*.zip

      - name: Package extension (.crx, optional)
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHROMIUM_EXTENSION_KEY_B64: ${{ secrets.CHROMIUM_EXTENSION_KEY_B64 }}
        run: |
          set -euo pipefail
          trap 'rm -f "YoutubeAdblock-extension.pem"' EXIT
          if [ -z "${CHROMIUM_EXTENSION_KEY_B64:-}" ]; then
            echo "No CHROMIUM_EXTENSION_KEY_B64 secret configured; skipping CRX packaging."
            exit 0
          fi
          printf '%s' "$CHROMIUM_EXTENSION_KEY_B64" | base64 -d > "YoutubeAdblock-extension.pem"
          npx --yes crx3@2.0.0 -p "YoutubeAdblock-extension.pem" -o "YoutubeAdblock-extension-v${VERSION}.crx" -- extension
          ls -la YoutubeAdblock-extension-v*.crx

      - name: Stage userscript artifact
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp YoutubeAdblock.user.js "YoutubeAdblock-v${VERSION}.user.js"

      - name: Upload artifacts (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: YoutubeAdblock-v${{ steps.version.outputs.version }}
          path: |
            YoutubeAdblock-extension-v*.zip
            YoutubeAdblock-v*.user.js
          if-no-files-found: error

      - name: Upload CRX artifact (manual dispatch, optional)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: YoutubeAdblock-v${{ steps.version.outputs.version }}-crx
          path: YoutubeAdblock-extension-v*.crx
          if-no-files-found: ignore

      - name: Ensure release exists (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "YoutubeAdblock v${VERSION}" \
              --generate-notes \
              --latest=false
          fi

      - name: Upload to release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "YoutubeAdblock-extension-v${VERSION}.zip"
            "YoutubeAdblock-v${VERSION}.user.js"
          )
          if [ -f "YoutubeAdblock-extension-v${VERSION}.crx" ]; then
            assets+=("YoutubeAdblock-extension-v${VERSION}.crx")
          fi
          gh release upload "${{ github.ref_name }}" \
            "${assets[@]}" \
            --clobber
